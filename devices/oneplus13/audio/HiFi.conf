# Phone-only Secondary MI2S SD1 route. Never use the Pad's TDM/calibration.
# Fixed amplifier attenuation is retained while PipeWire controls user volume.
SectionVerb {
    Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
    Comment "OnePlus 13 speakers"
    EnableSequence [
        cset "name='Amp0 Playback Volume' 896"
        cset "name='Amp1 Playback Volume' 896"
        cset "name='Secondary MI2S Audio Mixer MultiMedia1' 1,1"
    ]
    DisableSequence [
        cset "name='Amp0 Playback Volume' 0"
        cset "name='Amp1 Playback Volume' 0"
        cset "name='Secondary MI2S Audio Mixer MultiMedia1' 0,0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}
