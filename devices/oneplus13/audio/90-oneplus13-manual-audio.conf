# No automatic desktop opens of an unqualified speaker graph. The explicit
# bounded RAM checker uses ALSA directly. Remove this rule only after ordinary
# playback/protection and the full UCM profile have been independently qualified.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
