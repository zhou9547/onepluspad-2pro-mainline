# Explicit RAM activation only; supersedes the default-off rule for this card.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "OnePlus13-Audio-Probe" }
      { api.alsa.card.longname = "OnePlus13-Audio-Probe" }
    ]
    actions = { update-props = {
      device.disabled = false
      api.alsa.use-ucm = true
      api.alsa.soft-mixer = true
    } }
  }
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = {
      audio.format = "S16LE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
      api.alsa.disable-mmap = true
      channelmix.max-volume = 1.0
      session.suspend-timeout-seconds = 2
    } }
  }
]
