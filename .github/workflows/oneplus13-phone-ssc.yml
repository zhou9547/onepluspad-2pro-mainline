name: OnePlus 13 metadata-only SSC probe
on:
  push:
    branches: [oneplus13-platform-handoff-20261026]
    paths:
      - .github/workflows/oneplus13-phone-ssc.yml
      - tools/oneplus13/build-phone-ssc-probe.py
      - tools/oneplus13/ssc-patches/**
      - tools/oneplus13/ram-ssc-metadata.py
      - tools/oneplus13/qemu-ssc-metadata-selftest.py
      - tests/test_oneplus13_ssc_metadata.py
      - tools/oneplus13/ram-sensor-discovery.py
      - tools/oneplus13/ram-sensor-fileserver.py
      - tools/oneplus13/qemu-sensor-discovery-selftest.py
      - tests/test_oneplus13_sensor_discovery.py
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: oneplus13-phone-ssc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ssc:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare native offline build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc binutils ninja-build patch pkg-config python3-dev python3-venv libglib2.0-dev libqmi-glib-dev libmbim-glib-dev libqrtr-glib-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler ca-certificates
          pkg-config --exists glib-2.0 gio-unix-2.0 qmi-glib qrtr-glib libprotobuf-c
          python3 -m venv /tmp/phone-ssc-meson
          /tmp/phone-ssc-meson/bin/pip install meson==1.10.1
          test "$(uname -m)" = aarch64
      - name: Build guarded probe and test without QRTR or hardware
        run: |
          python3 -m unittest discover -s tests -p test_oneplus13_ssc_metadata.py -v
          python3 -m unittest discover -s tests -p test_oneplus13_sensor_fileserver.py -v
          python3 -m unittest discover -s tests -p test_oneplus13_sensor_discovery.py -v
          python3 tools/oneplus13/build-phone-ssc-probe.py --meson /tmp/phone-ssc-meson/bin/meson --output out/phone-ssc
      - name: Preserve public source evidence and isolated probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13-phone-ssc-${{ github.sha }}
          path: |
            out/phone-ssc/phone-ssc-probe-arm64.tar.gz
            out/phone-ssc/phone-ssc-probe-manifest.json
            out/phone-ssc/verification.json
            out/phone-ssc/build.log
            out/phone-ssc/LICENSE-*
            out/phone-ssc/COPYRIGHT.txt
            out/phone-ssc/release/meson-logs/testlog-phoneoffline.txt
            out/phone-ssc/sanitized/meson-logs/testlog-phoneoffline.txt
          if-no-files-found: error
          retention-days: 14
