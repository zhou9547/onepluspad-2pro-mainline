name: OnePlus 13 RAM GNOME handoff

on:
  push:
    branches: [oneplus13-bringup]
    paths: [.github/workflows/oneplus13-desktop.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oneplus13-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install userspace build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools zstd qemu-system-arm device-tree-compiler
      - name: Check handoff packaging and shell syntax
        run: |
          python3 -m unittest discover -s tests -p test_oneplus13_desktop.py -v
          for file in devices/oneplus13/desktop/*; do sh -n "$file"; done
          bash -n tools/oneplus13/rootfs.sh
      - uses: actions/download-artifact@v4
        with:
          name: oneplus13-offline-c2e659aaa062647a206c67edcc421f0fa9931f7a
          run-id: 39992904871
          github-token: ${{ github.token }}
          path: out/oneplus13-desktop-kernel
      - name: Independently verify the pinned kernel artifact
        run: python3 tools/oneplus13/verify.py --artifacts out/oneplus13-desktop-kernel
      - name: Build GNOME with matching modules and opt-in RAM services
        run: |
          sudo env ONEPLUS13_KERNEL_ARTIFACT="$PWD/out/oneplus13-desktop-kernel" \
            bash tools/oneplus13/rootfs.sh
      - name: Verify built SquashFS and actual ARM64 executables
        run: |
          sudo python3 tools/oneplus13/verify-rootfs.py out/oneplus13-rootfs-artifacts \
            --report out/oneplus13-rootfs-artifacts/download-verification.json
      - name: Boot the actual GNOME rootfs through switch_root in QEMU
        run: |
          python3 tools/oneplus13/desktop.py --kernel out/oneplus13-desktop-kernel \
            --rootfs out/oneplus13-rootfs-artifacts/rootfs.squashfs \
            --output out/oneplus13-desktop --qemu
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: oneplus13-desktop-handoff-${{ github.sha }}
          path: out/oneplus13-desktop/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: oneplus13-desktop-rootfs-${{ github.sha }}
          path: out/oneplus13-rootfs-artifacts/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
